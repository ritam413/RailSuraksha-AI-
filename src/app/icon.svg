<svg width="32" height="32" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient for Favicon visibility in dark & light browser tabs -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0B132B" />
      <stop offset="100%" stopColor="#030712" />
    </linearGradient>

    <!-- Rail Stroke Gradient -->
    <linearGradient id="railGrad" x1="12" y1="54" x2="52" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#2563EB" />
      <stop offset="50%" stopColor="#2B7FFF" />
      <stop offset="100%" stopColor="#00F0FF" />
    </linearGradient>

    <!-- Crossover Interlocking Track Gradient -->
    <linearGradient id="crossGrad" x1="14" y1="44" x2="50" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#3B82F6" stopOpacity="0.5" />
      <stop offset="50%" stopColor="#60A5FA" />
      <stop offset="100%" stopColor="#00F0FF" />
    </linearGradient>

    <!-- Horizon Schedule Arc Gradient -->
    <linearGradient id="horizonGrad" x1="8" y1="28" x2="56" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38BDF8" stopOpacity="0.4" />
      <stop offset="50%" stopColor="#00F0FF" />
      <stop offset="100%" stopColor="#F59E0B" />
    </linearGradient>

    <!-- Shield Gradient -->
    <linearGradient id="shieldGrad" x1="32" y1="4" x2="32" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#2B7FFF" stopOpacity="0.4" />
      <stop offset="100%" stopColor="#1E293B" stopOpacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Squircle Base Frame with 4px border radius equivalent -->
  <rect x="2" y="2" width="60" height="60" rx="10" fill="url(#bgGrad)" stroke="#2B7FFF" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Hexagonal Safety Shield Outline -->
  <path d="M32 8 L50 17 V37 L32 55 L14 37 V17 Z" fill="url(#shieldGrad)" stroke="#2B7FFF" stroke-width="1.2" stroke-opacity="0.35" stroke-linejoin="round" />

  <!-- Schedule Horizon Arc (24h / 7D / 30D Rolling Horizon) -->
  <path d="M12 26 C12 15 21 8 32 8 C43 8 52 15 52 26" stroke="url(#horizonGrad)" stroke-width="2" stroke-dasharray="3 3" stroke-linecap="round" />
  
  <!-- Schedule Horizon Marker Nodes -->
  <circle cx="21" cy="13" r="2" fill="#38BDF8" />
  <circle cx="32" cy="8" r="2.5" fill="#00F0FF" />
  <circle cx="43" cy="13" r="2" fill="#F59E0B" />

  <!-- Track Cross-Ties (Sleepers) -->
  <line x1="20" y1="48" x2="44" y2="48" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8" />
  <line x1="23" y1="40" x2="41" y2="40" stroke="#60A5FA" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.9" />
  <line x1="26" y1="32" x2="38" y2="32" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" />
  <line x1="29" y1="24" x2="35" y2="24" stroke="#BAE6FD" stroke-width="1.75" stroke-linecap="round" />

  <!-- Crossover Interlocking Switch Rail -->
  <path d="M16 46 Q 32 36 48 20" stroke="url(#crossGrad)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Main Left High-Speed Rail -->
  <path d="M18 52 C 18 42, 24 28, 30 14" stroke="url(#railGrad)" stroke-width="3.5" stroke-linecap="round" />

  <!-- Main Right High-Speed Rail -->
  <path d="M46 52 C 46 42, 40 28, 34 14" stroke="url(#railGrad)" stroke-width="3.5" stroke-linecap="round" />

  <!-- IoT Telemetry & Signal Status Vertices -->
  <circle cx="18" cy="52" r="2.5" fill="#2563EB" stroke="#FFFFFF" stroke-width="1" />
  <circle cx="46" cy="52" r="2.5" fill="#2563EB" stroke="#FFFFFF" stroke-width="1" />
  <circle cx="23" cy="40" r="2.2" fill="#10B981" stroke="#FFFFFF" stroke-width="1" />
  <circle cx="48" cy="20" r="2.2" fill="#00F0FF" stroke="#0F172A" stroke-width="1" />

  <!-- Central Kavach Safety Core / AI Interlocking Hub -->
  <circle cx="32" cy="35" r="4.5" fill="#00F0FF" />
  <circle cx="32" cy="35" r="2.2" fill="#0F172A" />

  <!-- Vanishing Apex Horizon Beacon -->
  <polygon points="32,10 34.5,14 29.5,14" fill="#FFFFFF" />
</svg>
